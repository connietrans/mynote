<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>My Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eceef4;
  --surface: #f5f6f9;
  --surface2: #eef0f5;
  --border: #d6dae6;
  --border-light: #e3e6ef;
  --text: #2e3447;
  --text-muted: #7e8699;
  --text-light: #adb3c4;
  --accent: #7b8fb5;
  --accent-hover: #667aa0;
  --accent-soft: #e8ecf4;
  --blue-mid: #9aaac8;
  --success: #7fa896;
  --success-soft: #e6f0ed;
  --warning: #b8a07a;
  --warning-soft: #f5f0e8;
  --danger: #b07a7a;
  --danger-soft: #f2eaea;
  --repeat: #8a8fb5;
  --repeat-soft: #eceef5;
  --shadow-sm: 0 1px 4px rgba(100,115,150,0.08);
  --shadow: 0 4px 16px rgba(100,115,150,0.12);
  --shadow-lg: 0 8px 32px rgba(100,115,150,0.16);
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }

/* AUTH */
#auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #e3e6ef 0%, #eceef4 50%, #e0e4ef 100%); }
.auth-card { background: var(--surface); border-radius: 20px; padding: 44px 40px; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
.auth-logo { width: 48px; height: 48px; background: linear-gradient(135deg, #7b8fb5, #9aaac8); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 20px; }
.auth-card h1 { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.auth-card p { color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.form-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123,143,181,0.1); }
.auth-error { color: var(--danger); font-size: 12px; margin-bottom: 14px; padding: 10px 12px; background: var(--danger-soft); border-radius: var(--radius-sm); display: none; }
.btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg, #7b8fb5, #9aaac8); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }

/* APP */
#app-screen { display: none; min-height: 100vh; padding-bottom: 72px; }
.page-hidden { display: none !important; }

/* HEADER */
.app-header { background: var(--surface); border-bottom: 1px solid var(--border-light); padding: 14px 20px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #7b8fb5, #9aaac8); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-title { font-size: 18px; font-weight: 700; color: var(--text); }
.btn-signout { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; padding: 6px 12px; border-radius: 20px; }
.header-date { font-size: 12px; color: var(--text-muted); }

/* QUOTE */
.quote-banner { background: linear-gradient(135deg, var(--accent) 0%, #8aa5cc 100%); padding: 14px 20px; color: #fff; cursor: pointer; }
.quote-text { font-family: 'Lora', serif; font-style: italic; font-size: 13px; line-height: 1.6; opacity: 0.95; }
.quote-author { font-size: 11px; opacity: 0.75; margin-top: 3px; font-weight: 500; }

/* PROGRESS */
.progress-bar-wrap { background: var(--surface); padding: 10px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 12px; }
.progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; font-weight: 500; }
.progress-track { flex: 1; height: 5px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #7b8fb5, #9aaac8); border-radius: 99px; transition: width 0.4s ease; }
.progress-pct { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 30px; text-align: right; }

/* SECTION HEADERS */
.col-header { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; padding: 0 2px; display: flex; align-items: center; gap: 6px; }
.col-header .col-count { background: var(--accent-soft); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 20px; font-weight: 700; }
.col-header.overdue-header .col-count { background: var(--danger-soft); color: var(--danger); }
.col-header.nodate-header .col-count { background: var(--surface2); color: var(--text-muted); }

/* ADD CARD */
.add-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.add-row { display: flex; gap: 8px; margin-bottom: 8px; }
.add-input { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; transition: border-color 0.2s; }
.add-input:focus { border-color: var(--accent); }
.btn-add { padding: 9px 14px; background: linear-gradient(135deg, #7b8fb5, #9aaac8); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-add:hover { opacity: 0.88; }
.add-options { display: flex; gap: 6px; flex-wrap: wrap; }
.add-select { padding: 6px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; color: var(--text); outline: none; }

/* TASK CARDS */
.task-list { display: flex; flex-direction: column; gap: 5px; }
.task-card { background: var(--surface); border: 1px solid var(--border-light); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow-sm); animation: slideIn 0.2s ease; cursor: default; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.task-card:hover { box-shadow: var(--shadow); }
.task-card.dragging { opacity: 0.4; }
.task-card.drag-over { border-color: var(--accent); background: var(--accent-soft); }
.task-card.done { opacity: 0.5; }
.task-card.overdue { border-left: 3px solid var(--danger); }
.task-main-row { display: flex; align-items: flex-start; gap: 8px; }
.drag-handle { font-size: 13px; color: var(--border); cursor: grab; flex-shrink: 0; margin-top: 2px; user-select: none; }
.drag-handle:hover { color: var(--text-muted); }
.task-check { width: 17px; height: 17px; border: 1.5px solid var(--border); border-radius: 4px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.2s; }
.task-check:hover { border-color: var(--accent); background: var(--accent-soft); }
.task-check.checked { background: var(--success); border-color: var(--success); }
.task-check.checked::after { content: ''; width: 4px; height: 8px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); display: block; }
.task-body { flex: 1; min-width: 0; }
.task-text { font-size: 13px; font-weight: 400; line-height: 1.4; color: var(--text); word-break: break-word; }
.task-card.done .task-text { text-decoration: line-through; color: var(--text-muted); }
.task-meta { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
.tag-today { background: var(--accent-soft); color: var(--accent); }
.tag-repeat { background: var(--repeat-soft); color: var(--repeat); }
.tag-nodate { background: var(--surface2); color: var(--text-muted); }
.tag-overdue { background: var(--danger-soft); color: var(--danger); }
.task-date-text { font-size: 11px; color: var(--text-light); font-weight: 500; }
.task-actions { display: flex; gap: 3px; flex-shrink: 0; opacity: 0; transition: opacity 0.18s; }
.task-card:hover .task-actions { opacity: 1; }
.btn-icon { background: none; border: 1px solid var(--border); border-radius: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; transition: all 0.15s; color: var(--text-muted); }
.btn-icon:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
.btn-icon.delete:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.edit-row { display: none; margin-top: 8px; gap: 6px; }
.edit-row.open { display: flex; }
.edit-input { flex: 1; padding: 7px 10px; border: 1.5px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; color: var(--text); outline: none; }
.reschedule-row { display: none; margin-top: 8px; gap: 6px; align-items: center; flex-wrap: wrap; }
.reschedule-row.open { display: flex; }
.reschedule-row input[type="date"] { padding: 5px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; color: var(--text); outline: none; }
.btn-sm { padding: 5px 10px; border-radius: var(--radius-sm); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-muted); }
.btn-sm.confirm { background: var(--accent); color: #fff; border-color: var(--accent); }
.subtask-toggle { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; user-select: none; }
.subtask-area { display: none; margin-top: 8px; padding-left: 24px; border-left: 2px solid var(--border-light); }
.subtask-area.open { display: block; }
.subtask-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border-light); }
.subtask-item:last-child { border-bottom: none; }
.subtask-check { width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 3px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.subtask-check:hover { border-color: var(--success); }
.subtask-check.checked { background: var(--success); border-color: var(--success); }
.subtask-check.checked::after { content: ''; width: 3px; height: 5px; border: 1.5px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); display: block; }
.subtask-text { flex: 1; font-size: 12px; color: var(--text); }
.subtask-text.done { text-decoration: line-through; color: var(--text-muted); }
.subtask-del { font-size: 11px; color: var(--text-light); cursor: pointer; opacity: 0; background: none; border: none; padding: 2px 4px; }
.subtask-item:hover .subtask-del { opacity: 1; }
.subtask-add-row { display: flex; gap: 6px; margin-top: 6px; }
.subtask-input { flex: 1; padding: 5px 8px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--surface2); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; color: var(--text); outline: none; }
.subtask-input:focus { border-color: var(--accent); }
.btn-subtask-add { padding: 5px 8px; background: var(--accent-soft); color: var(--accent); border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; }
.btn-subtask-add:hover { background: var(--accent); color: #fff; }
.empty-state { text-align: center; padding: 30px 16px; color: var(--text-muted); }
.empty-state .icon { font-size: 32px; margin-bottom: 10px; }
.empty-state h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.empty-state p { font-size: 12px; }

/* MOBILE TODAY LAYOUT */
.today-mobile { padding: 14px 12px; }
.today-col { margin-bottom: 20px; }
.today-col-divider { height: 1px; background: var(--border-light); margin: 16px 0; }

/* DESKTOP TODAY LAYOUT — 3 columns */
.today-desktop { display: none; }

/* PROJECTS */
#page-projects { display: none; }
#page-calendar { display: none; }
.project-card { background: var(--surface); border: 1.5px solid var(--border-light); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }
.project-header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.project-header:hover { background: var(--surface2); }
.project-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.project-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--text); }
.project-progress-mini { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.project-chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
.project-card.open .project-chevron { transform: rotate(90deg); }
.project-prog-bar { height: 3px; background: var(--border-light); }
.project-prog-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
.project-body { display: none; padding: 0 16px 16px; }
.project-card.open .project-body { display: block; }
.proj-task-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.proj-task-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: var(--surface2); border: 1px solid var(--border-light); border-radius: var(--radius-sm); }
.proj-task-item:hover { box-shadow: var(--shadow-sm); }
.proj-task-item.dragging { opacity: 0.4; }
.proj-task-item.drag-over { border-color: var(--accent); background: var(--accent-soft); }
.proj-task-text { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
.proj-task-text.done { text-decoration: line-through; color: var(--text-muted); }
.proj-subtask-area { display: none; padding-left: 28px; border-left: 2px solid var(--border-light); margin-left: 28px; }
.proj-subtask-area.open { display: block; }
.add-project-card { background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
.add-project-row { display: flex; gap: 8px; }
.color-dots { display: flex; gap: 6px; margin-top: 10px; }
.color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s; }
.color-dot:hover { transform: scale(1.2); }
.color-dot.selected { border-color: var(--text); transform: scale(1.15); }

/* BOTTOM NAV */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border-light); display: flex; z-index: 200; box-shadow: 0 -4px 20px rgba(100,115,150,0.08); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 12px; cursor: pointer; border: none; background: none; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-muted); gap: 3px; }
.nav-icon { font-size: 20px; }
.nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; }
.nav-item.active { color: var(--accent); }

/* LOADING */
.loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }

/* CALENDAR */
.cal-wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-month-label { font-size: 17px; font-weight: 700; color: var(--text); }
.btn-cal-nav { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; color: var(--text-muted); }
.btn-cal-nav:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.cal-grid { background: var(--surface); border: 1.5px solid var(--border-light); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1.5px solid var(--border-light); }
.cal-weekday { text-align: center; padding: 8px 0; font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-day { min-height: 64px; border-right: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light); padding: 5px 4px; cursor: pointer; transition: background 0.15s; }
.cal-day:nth-child(7n) { border-right: none; }
.cal-day:hover { background: var(--accent-soft); }
.cal-day.today { background: var(--accent-soft); }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-day.other-month { opacity: 0.35; }
.cal-day.selected { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.cal-day-num { font-size: 11px; font-weight: 600; color: var(--text); margin-bottom: 3px; display: block; }
.cal-dots { display: flex; flex-wrap: wrap; gap: 2px; }
.cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-dot.done { background: var(--success); opacity: 0.5; }
.cal-day-panel { background: var(--surface); border: 1.5px solid var(--border-light); border-radius: var(--radius); margin-top: 16px; padding: 16px; box-shadow: var(--shadow-sm); }
.cal-panel-date { font-size: 15px; font-weight: 700; color: var(--text); display: block; margin-bottom: 12px; }
.cal-panel-tasks { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.cal-task-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border-light); border-radius: var(--radius-sm); }
.cal-task-text { flex: 1; font-size: 13px; color: var(--text); }
.cal-task-text.done { text-decoration: line-through; color: var(--text-muted); }
.cal-add-row { display: flex; gap: 8px; }

/* THEME */
.theme-btn { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 5px 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; margin-right: 6px; }
.theme-panel { display: none; position: fixed; top: 60px; right: 16px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-lg); z-index: 500; width: 260px; }
.theme-panel.open { display: block; }
.theme-panel h3 { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
.theme-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.theme-preset { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: transform 0.15s; }
.theme-preset:hover { transform: scale(1.15); }
.theme-preset.active { border-color: var(--text); }
.color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.color-row span { font-size: 12px; color: var(--text-muted); width: 70px; flex-shrink: 0; }
.color-row input[type=color] { width: 36px; height: 28px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; padding: 2px; background: var(--surface2); }
.btn-apply-theme { width: 100%; padding: 8px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 6px; }

/* DESKTOP SIDEBAR CAL */
.desktop-cal-sidebar { display: none; }

/* ── DESKTOP LAYOUT ── */
@media (min-width: 900px) {
  .today-mobile { display: none; }
  .today-desktop {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr) 380px;
    gap: 0;
    min-height: calc(100vh - 120px - 72px);
    align-items: start;
  }
  .today-col-cal {
    background: var(--surface);
    border-right: 1px solid var(--border-light);
    padding: 16px;
    position: sticky;
    top: 120px;
    max-height: calc(100vh - 120px - 72px);
    overflow-y: auto;
  }
  .today-col-main {
    padding: 16px 20px;
    border-right: 1px solid var(--border-light);
    min-height: calc(100vh - 120px - 72px);
  }
  .today-col-side {
    padding: 16px;
    min-height: calc(100vh - 120px - 72px);
  }
}

/* MOBILE */
@media (max-width: 480px) {
  .app-header { padding: 12px 14px; }
  .auth-card { padding: 32px 24px; }
  .cal-day { min-height: 46px; padding: 3px; }
  .cal-day-num { font-size: 10px; }
  .task-actions { opacity: 1; }
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">

// ── ADD TASK ──
async function addTask(type, mob) {
  const suffix = mob ? '-mob' : '';
  const inputId = type === 'today' ? `new-task-text${suffix}` : type === 'nodate' ? `new-task-text-nodate${suffix}` : `new-task-text-repeat${suffix}`;
  const text = document.getElementById(inputId).value.trim();
  if (!text) return;
  const user = auth.currentUser;
  if (!user) return;
  const today = todayStr();
  const data = { uid: user.uid, text, type, done: false, subtasks: [], order: Date.now(), createdAt: TS() };
  if (type === 'today') data.date = today;
  if (type === 'repeat') {
    const periodEl = document.getElementById(mob ? 'new-repeat-period-mob' : 'new-repeat-period');
    data.period = periodEl.value;
    data.nextDue = today;
  }
  await db.collection('tasks').add(data);
  document.getElementById(inputId).value = '';
}

// ── LOAD TASKS ──
function loadTasks(uid) {
  db.collection('tasks').where('uid','==',uid).onSnapshot(async snap => {
    const today = todayStr();
    const tasks = [];
    for (const ds of snap.docs) {
      const d = { id: ds.id, ...ds.data() };
      if (d.type==='repeat' && d.done && shouldResetRepeat(d, today)) {
        const next = calcNextDue(d.period, d.nextDue||today);
        await db.collection('tasks').doc(d.id).update({ done:false, nextDue:next });
        d.done=false; d.nextDue=next;
      }
      tasks.push(d);
    }
    allTasksCache = tasks;
    renderTasks(tasks, today);
    if (document.getElementById('page-calendar').style.display==='block') renderCalendar();
    if (calSelectedDate) renderCalDayPanel(calSelectedDate);
    renderDesktopCal();
    if (desktopCalSelected) renderDesktopCalPanel(desktopCalSelected);
  });
}

function shouldResetRepeat(t, today) {
  const due = t.nextDue||today;
  if (t.period==='daily') return today>due;
  if (t.period==='weekly') return new Date(today)>=new Date(new Date(due).getTime()+7*86400000);
  if (t.period==='monthly') { const d=new Date(due); return new Date(today)>=new Date(d.getFullYear(),d.getMonth()+1,d.getDate()); }
  return false;
}
function calcNextDue(period, from) {
  const d=new Date(from);
  if (period==='daily') d.setDate(d.getDate()+1);
  else if (period==='weekly') d.setDate(d.getDate()+7);
  else if (period==='monthly') d.setMonth(d.getMonth()+1);
  return d.toISOString().split('T')[0];
}

// ── RENDER TASKS ──
function renderTasks(tasks, today) {
  const isDesktop = window.innerWidth >= 900;

  // Categorize
  const todayTasks = tasks.filter(t => t.type==='today' && t.date===today).sort((a,b)=>(a.done!==b.done?a.done?1:-1:(a.order||0)-(b.order||0)));
  const overdueTasks = tasks.filter(t => t.type==='today' && t.date && t.date<today && !t.done).sort((a,b)=>(a.date<b.date?-1:1));
  const noDateTasks = tasks.filter(t => t.type==='nodate').sort((a,b)=>(a.done!==b.done?a.done?1:-1:(a.order||0)-(b.order||0)));
  const repeatTasks = tasks.filter(t => t.type==='repeat' && (t.nextDue||today)<=today).sort((a,b)=>(a.done!==b.done?a.done?1:-1:(a.order||0)-(b.order||0)));

  // Progress
  const allForProgress = [...todayTasks, ...repeatTasks];
  const doneCount = allForProgress.filter(t=>t.done).length;
  const pct = allForProgress.length ? Math.round(doneCount/allForProgress.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-label').textContent = `${doneCount}/${allForProgress.length} done`;

  const empty = list => list.length===0 ? `<div class="empty-state"><div class="icon" style="font-size:24px">✓</div><p>All clear</p></div>` : '';

  if (isDesktop) {
    // Desktop
    setCount('desk-today-count', todayTasks.length);
    setCount('desk-overdue-count', overdueTasks.length);
    setCount('desk-nodate-count', noDateTasks.length);
    setCount('desk-repeat-count', repeatTasks.length);
    document.getElementById('task-list-today').innerHTML = empty(todayTasks) || renderTaskList(todayTasks, today, 'sortable-today');
    document.getElementById('task-list-overdue').innerHTML = empty(overdueTasks) || renderTaskList(overdueTasks, today, null);
    document.getElementById('task-list-nodate').innerHTML = empty(noDateTasks) || renderTaskList(noDateTasks, today, 'sortable-nodate');
    document.getElementById('task-list-repeat').innerHTML = empty(repeatTasks) || renderTaskList(repeatTasks, today, null);
    if (document.getElementById('sortable-today')) initDragTasks(todayTasks, 'sortable-today');
    if (document.getElementById('sortable-nodate')) initDragTasks(noDateTasks, 'sortable-nodate');
  } else {
    // Mobile
    setCount('mob-today-count', todayTasks.length);
    setCount('mob-overdue-count', overdueTasks.length);
    setCount('mob-nodate-count', noDateTasks.length);
    setCount('mob-repeat-count', repeatTasks.length);
    document.getElementById('task-list-today-mob').innerHTML = empty(todayTasks) || renderTaskList(todayTasks, today, 'sortable-today-mob');
    document.getElementById('task-list-overdue-mob').innerHTML = empty(overdueTasks) || renderTaskList(overdueTasks, today, null);
    document.getElementById('task-list-nodate-mob').innerHTML = empty(noDateTasks) || renderTaskList(noDateTasks, today, 'sortable-nodate-mob');
    document.getElementById('task-list-repeat-mob').innerHTML = empty(repeatTasks) || renderTaskList(repeatTasks, today, null);
  }
}

function setCount(id, n) { const el=document.getElementById(id); if(el) el.textContent=n; }

function renderTaskList(tasks, today, sortableId) {
  return `<div class="task-list"${sortableId?` id="${sortableId}"`:''}>${tasks.map(t=>renderTask(t,today)).join('')}</div>`;
}

function renderTask(t, today) {
  const isOverdue = t.type==='today' && t.date && t.date<today && !t.done;
  const isDone = t.done;
  const subs = t.subtasks||[];
  const subDone = subs.filter(s=>s.done).length;
  let tags = '';
  if (isOverdue) tags += `<span class="tag tag-overdue">overdue</span>`;
  else if (t.type==='today') tags += `<span class="tag tag-today">today</span>`;
  else if (t.type==='repeat') tags += `<span class="tag tag-repeat">${t.period}</span>`;
  else tags += `<span class="tag tag-nodate">no date</span>`;
  let dateText = '';
  if (t.type==='today'&&t.date) dateText += `<span class="task-date-text">${fmtDate(t.date)}</span>`;
  if (t.type==='repeat'&&t.nextDue) dateText += `<span class="task-date-text">due ${fmtDate(t.nextDue)}</span>`;
  if (subs.length) dateText += `<span class="task-date-text">· ${subDone}/${subs.length}</span>`;
  const reschedBtn = (t.type==='today'||isOverdue) ? `<button class="btn-icon" title="Reschedule" onclick="toggleReschedule('${t.id}')">📅</button>` : '';
  const subsHtml = subs.map((s,i)=>`
    <div class="subtask-item">
      <div class="subtask-check ${s.done?'checked':''}" onclick="toggleSubtask('${t.id}',${i})"></div>
      <span class="subtask-text ${s.done?'done':''}">${esc(s.text)}</span>
      <button class="subtask-del" onclick="deleteSubtask('${t.id}',${i})">✕</button>
    </div>`).join('');
  return `<div class="task-card ${isDone?'done':''} ${isOverdue?'overdue':''}" id="card-${t.id}" draggable="true" data-id="${t.id}">
    <div class="task-main-row">
      <span class="drag-handle">⠿</span>
      <div class="task-check ${isDone?'checked':''}" onclick="toggleDone('${t.id}',${isDone})"></div>
      <div class="task-body">
        <div class="task-text">${esc(t.text)}</div>
        <div class="task-meta">${tags}${dateText}</div>
        <div class="subtask-toggle" onclick="toggleSubArea('${t.id}')">▶ Subtasks${subs.length?` (${subDone}/${subs.length})`:''}</div>
        <div class="subtask-area" id="subarea-${t.id}">
          ${subsHtml}
          <div class="subtask-add-row">
            <input class="subtask-input" id="subinput-${t.id}" placeholder="Add subtask..." onkeydown="if(event.key==='Enter') addSubtask('${t.id}')" />
            <button class="btn-subtask-add" onclick="addSubtask('${t.id}')">+ Add</button>
          </div>
        </div>
        <div class="edit-row" id="edit-${t.id}">
          <input class="edit-input" id="edit-input-${t.id}" value="${esc(t.text)}" onkeydown="if(event.key==='Enter') saveEdit('${t.id}')" />
          <button class="btn-sm confirm" onclick="saveEdit('${t.id}')">Save</button>
          <button class="btn-sm" onclick="toggleEdit('${t.id}')">Cancel</button>
        </div>
        <div class="reschedule-row" id="reschedule-${t.id}">
          <input type="date" id="reschedule-date-${t.id}" value="${todayStr()}" />
          <button class="btn-sm confirm" onclick="reschedule('${t.id}')">Save</button>
          <button class="btn-sm" onclick="toggleReschedule('${t.id}')">Cancel</button>
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-icon" onclick="toggleEdit('${t.id}')">✏️</button>
        ${reschedBtn}
        <button class="btn-icon delete" onclick="deleteTask('${t.id}')">✕</button>
      </div>
    </div>
  </div>`;
}

function toggleDone(id, cur) { db.collection('tasks').doc(id).update({done:!cur}); }
function deleteTask(id) { db.collection('tasks').doc(id).delete(); }
function toggleEdit(id) { const r=document.getElementById('edit-'+id); r.classList.toggle('open'); if(r.classList.contains('open')) document.getElementById('edit-input-'+id).focus(); }
async function saveEdit(id) { const v=document.getElementById('edit-input-'+id).value.trim(); if(!v) return; await db.collection('tasks').doc(id).update({text:v}); }
function toggleReschedule(id) { document.getElementById('reschedule-'+id).classList.toggle('open'); }
async function reschedule(id) { const d=document.getElementById('reschedule-date-'+id).value; if(!d) return; await db.collection('tasks').doc(id).update({date:d,done:false}); document.getElementById('reschedule-'+id).classList.remove('open'); }
function toggleSubArea(id) { document.getElementById('subarea-'+id).classList.toggle('open'); }
async function addSubtask(id) {
  const inp=document.getElementById('subinput-'+id); const text=inp.value.trim(); if(!text) return;
  const card=document.getElementById('card-'+id);
  const checks=card.querySelectorAll('.subtask-check'), texts=card.querySelectorAll('.subtask-text');
  const subs=[]; checks.forEach((c,i)=>subs.push({text:texts[i].textContent,done:c.classList.contains('checked')}));
  subs.push({text,done:false}); await db.collection('tasks').doc(id).update({subtasks:subs}); inp.value='';
}
async function toggleSubtask(id, idx) {
  const card=document.getElementById('card-'+id);
  const checks=card.querySelectorAll('.subtask-check'), texts=card.querySelectorAll('.subtask-text');
  const subs=[]; checks.forEach((c,i)=>subs.push({text:texts[i].textContent,done:i===idx?!c.classList.contains('checked'):c.classList.contains('checked')}));
  await db.collection('tasks').doc(id).update({subtasks:subs});
}
async function deleteSubtask(id, idx) {
  const card=document.getElementById('card-'+id);
  const checks=card.querySelectorAll('.subtask-check'), texts=card.querySelectorAll('.subtask-text');
  const subs=[]; checks.forEach((c,i)=>{if(i!==idx) subs.push({text:texts[i].textContent,done:c.classList.contains('checked')});});
  await db.collection('tasks').doc(id).update({subtasks:subs});
}

function initDragTasks(tasks, listId) {
  let dragId=null;
  document.querySelectorAll(`#${listId} .task-card`).forEach(card => {
    card.addEventListener('dragstart', e=>{dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend', ()=>{card.classList.remove('dragging');document.querySelectorAll('.task-card').forEach(c=>c.classList.remove('drag-over'));});
    card.addEventListener('dragover', e=>{e.preventDefault();card.classList.add('drag-over');});
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', async e=>{
      e.preventDefault(); card.classList.remove('drag-over');
      if (!dragId||dragId===card.dataset.id) return;
      const allCards=[...document.querySelectorAll(`#${listId} .task-card`)];
      const from=allCards.findIndex(c=>c.dataset.id===dragId), to=allCards.findIndex(c=>c.dataset.id===card.dataset.id);
      const ordered=allCards.map(c=>c.dataset.id); ordered.splice(from,1); ordered.splice(to,0,dragId);
      for (let i=0;i<ordered.length;i++) await db.collection('tasks').doc(ordered[i]).update({order:i*10});
    });
  });
}

function renderProject(p) {

window.deleteProjTask = async (pid,ti) => { const p=projectsCache.find(x=>x.id===pid); if(!p) return; await db.collection('projects').doc(pid).update({tasks:(p.tasks||[]).filter((_,i)=>i!==ti)}); };

window.toggleProjSubtask = async (pid,ti,si) => { const p=projectsCache.find(x=>x.id===pid); if(!p) return; const t=JSON.parse(JSON.stringify(p.tasks||[])); t[ti].subtasks[si].done=!t[ti].subtasks[si].done; await db.collection('projects').doc(pid).update({tasks:t}); };
window.deleteProjSubtask = async (pid,ti,si) => { const p=projectsCache.find(x=>x.id===pid); if(!p) return; const t=JSON.parse(JSON.stringify(p.tasks||[])); t[ti].subtasks.splice(si,1); await db.collection('projects').doc(pid).update({tasks:t}); };
document.addEventListener('drop', async e => {

  }
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  for(let d=1;d<=totalCells-firstDay-daysInMonth;d++) html+=`<div class="cal-day other-month" style="min-height:38px"><span class="cal-day-num">${d}</span></div>`;
  document.getElementById('desktop-cal-days').innerHTML=html;
  if (desktopCalSelected) renderDesktopCalPanel(desktopCalSelected);
}
window.selectDesktopDay = ds => { desktopCalSelected=ds; renderDesktopCal(); renderDesktopCalPanel(ds); };
function renderDesktopCalPanel(ds) {
  const tasks=allTasksCache.filter(t=>t.type==='today'&&t.date===ds);
  const [y,m,d]=ds.split('-');
  const label=new Date(+y,+m-1,+d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('desktop-cal-panel').innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em">${label}</div>
    <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:8px">${tasks.length
      ? tasks.map(t=>`<div style="display:flex;align-items:center;gap:5px;padding:5px 7px;background:var(--surface2);border-radius:6px;border:1px solid var(--border-light)"><div class="subtask-check ${t.done?'checked':''}" onclick="toggleDone('${t.id}',${t.done})" style="width:13px;height:13px;flex-shrink:0"></div><span style="font-size:11px;flex:1;${t.done?'text-decoration:line-through;color:var(--text-muted)':''}">${esc(t.text)}</span><button class="btn-icon delete" style="width:18px;height:18px;font-size:9px" onclick="deleteTask('${t.id}')">✕</button></div>`).join('')
      : `<div style="font-size:11px;color:var(--text-muted)">No tasks</div>`}
    </div>
    <div style="display:flex;gap:5px">
      <input class="add-input" id="desktop-cal-input" placeholder="Add task..." style="font-size:11px;padding:5px 8px" onkeydown="if(event.key==='Enter') desktopCalAdd('${ds}')" />
      <button class="btn-add" style="font-size:10px;padding:5px 8px" onclick="desktopCalAdd('${ds}')">+</button>
    </div>`;
}
window.desktopCalAdd = async ds => {
  const inp=document.getElementById('desktop-cal-input'); const text=inp.value.trim(); if(!text) return;
  const user=auth.currentUser; if(!user) return;
  await db.collection('tasks').add({uid:user.uid,text,type:'today',date:ds,done:false,subtasks:[],order:Date.now(),createdAt:TS()});
  inp.value='';
};
window.dropPlanTask = async (e, dateStr) => {
  e.preventDefault(); e.target.closest('.cal-day')?.classList.remove('drag-over');
  const data=e.dataTransfer.getData('planTask'); if(!data) return;
  const {pid,ti}=JSON.parse(data); const p=projectsCache.find(x=>x.id===pid); if(!p) return;
  const taskText=p.tasks[ti]?.text; if(!taskText) return;
  const user=auth.currentUser; if(!user) return;
  await db.collection('tasks').add({uid:user.uid,text:taskText,type:'today',date:dateStr,done:false,subtasks:[],order:Date.now(),createdAt:TS()});
};

// ── THEME ──
const THEMES=[
  {name:'Morandi Blue',bg:'#eceef4',surface:'#f5f6f9',accent:'#7b8fb5',text:'#2e3447'},
  {name:'Warm Sand',bg:'#f5f0e8',surface:'#fdfaf5',accent:'#a07860',text:'#2e2418'},
  {name:'Sage Green',bg:'#edf2ed',surface:'#f5f8f5',accent:'#6a9a72',text:'#1e2e20'},
  {name:'Dusty Rose',bg:'#f5eef0',surface:'#fdf7f8',accent:'#b07a8a',text:'#2e1e22'},
  {name:'Slate Dark',bg:'#1e2330',surface:'#262d3d',accent:'#7b9fd4',text:'#d8dff0'},
  {name:'Lavender',bg:'#f0eef8',surface:'#f8f7fd',accent:'#8b7ac8',text:'#2a2040'},
];
function initThemePresets() {
  document.getElementById('theme-presets').innerHTML=THEMES.map((t,i)=>`<div class="theme-preset" style="background:${t.accent}" title="${t.name}" onclick="applyPresetTheme(${i})"></div>`).join('');
}
window.applyPresetTheme = i => { const t=THEMES[i]; applyThemeVars(t.bg,t.surface,t.accent,t.text); localStorage.setItem('theme',JSON.stringify(t)); document.querySelectorAll('.theme-preset').forEach((e,j)=>e.classList.toggle('active',j===i)); };
function applyCustomTheme() { const bg=document.getElementById('tc-bg').value,surface=document.getElementById('tc-surface').value,accent=document.getElementById('tc-accent').value,text=document.getElementById('tc-text').value; applyThemeVars(bg,surface,accent,text); localStorage.setItem('theme',JSON.stringify({bg,surface,accent,text})); }
function applyThemeVars(bg,surface,accent,text) {
  const r=document.documentElement;
  r.style.setProperty('--bg',bg); r.style.setProperty('--surface',surface); r.style.setProperty('--surface2',lighten(bg,0.3));
  r.style.setProperty('--accent',accent); r.style.setProperty('--accent-hover',darken(accent,0.1)); r.style.setProperty('--accent-soft',lighten(accent,0.85));
  r.style.setProperty('--blue-mid',lighten(accent,0.2)); r.style.setProperty('--text',text);
  r.style.setProperty('--text-muted',lighten(text,0.4)); r.style.setProperty('--text-light',lighten(text,0.6));
  r.style.setProperty('--border',lighten(bg,-0.08)); r.style.setProperty('--border-light',lighten(bg,-0.04));
}
function lighten(hex,amount) {
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.max(0,Math.round(r+(amount>0?(255-r)*amount:r*amount))));
  g=Math.min(255,Math.max(0,Math.round(g+(amount>0?(255-g)*amount:g*amount))));
  b=Math.min(255,Math.max(0,Math.round(b+(amount>0?(255-b)*amount:b*amount))));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
function darken(hex,amount){return lighten(hex,-amount);}
function loadTheme() {
  initThemePresets();
  const saved=localStorage.getItem('theme');
  if(saved){const t=JSON.parse(saved);applyThemeVars(t.bg,t.surface,t.accent,t.text);document.getElementById('tc-bg').value=t.bg;document.getElementById('tc-surface').value=t.surface;document.getElementById('tc-accent').value=t.accent;document.getElementById('tc-text').value=t.text;}
}
</script>
